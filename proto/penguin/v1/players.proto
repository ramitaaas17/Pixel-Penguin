syntax = "proto3";
package penguin.v1;
option go_package = "pixelpenguin/platform/gen/penguin/v1;penguinv1";
import "penguin/v1/common.proto";
message Player { int64 id = 1; string name = 2; int64 coins = 3; }
message PlayerList { repeated Player players = 1; }
message CreatePlayerRequest { string name = 1; int64 coins = 2; }
message UpdateCoinsRequest { int64 id = 1; int64 coins = 2; }
message CoffeeDrop { int32 id = 1; int32 kind = 2; int32 at_ms = 3; int32 until_ms = 4; }
message CoffeePlan { string run_id = 1; int32 duration_ms = 2; repeated int32 recipes = 3; repeated CoffeeDrop drops = 4; }
message CoffeeAction { int32 drop_id = 1; int32 at_ms = 2; }
message FinishCoffeeRequest { string run_id = 1; repeated CoffeeAction actions = 2; }
message CoffeeResult { int64 score = 1; int64 coins = 2; int64 balance = 3; int32 served = 4; int32 lost = 5; int32 wrong = 6; int32 level = 7; }
service Players {
  rpc StartCoffeeGame(Empty) returns (CoffeePlan);
  rpc FinishCoffeeGame(FinishCoffeeRequest) returns (CoffeeResult);
  rpc ListPlayers(Empty) returns (PlayerList);
  rpc GetPlayer(IdRequest) returns (Player);
  rpc CreatePlayer(CreatePlayerRequest) returns (Player);
  rpc UpdateCoins(UpdateCoinsRequest) returns (Player);
}
