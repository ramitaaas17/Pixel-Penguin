syntax = "proto3";
package penguin.v1;
option go_package = "pixelpenguin/platform/gen/penguin/v1;penguinv1";
import "penguin/v1/common.proto";
message Product { int64 id = 1; string name = 2; double price = 3; int64 stock = 4; }
message ProductList { repeated Product products = 1; }
message CreateProductRequest { string name = 1; double price = 2; int64 stock = 3; }
message UpdateStockRequest { int64 id = 1; int64 stock = 2; }
service Store {
  rpc ListProducts(Empty) returns (ProductList);
  rpc GetProduct(IdRequest) returns (Product);
  rpc CreateProduct(CreateProductRequest) returns (Product);
  rpc UpdateStock(UpdateStockRequest) returns (Product);
}
