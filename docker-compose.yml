services:
  kafka:
    image: apache/kafka:4.1.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
    networks: [appnet]
  kafka-topics:
    image: apache/kafka:4.1.2
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for service in jugadores tienda cafeteria; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic pixelpenguin.$$service --partitions 3 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic pixelpenguin.chat --partitions 1 --replication-factor 1 --config retention.ms=3600000
    networks: [appnet]
  kafka-rest:
    image: confluentinc/cp-kafka-rest:8.0.0
    environment:
      KAFKA_REST_HOST_NAME: kafka-rest
      KAFKA_REST_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_REST_LISTENERS: http://0.0.0.0:8082
      KAFKA_REST_PRODUCER_ACKS: all
    depends_on:
      kafka-topics:
        condition: service_completed_successfully
    networks: [appnet]
  consul:
    image: hashicorp/consul:1.22
    command: ["agent", "-server", "-bootstrap-expect=1", "-client=0.0.0.0", "-bind=0.0.0.0", "-data-dir=/consul/data"]
    volumes:
      - consul-data:/consul/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8500/v1/status/leader | grep -q ':8300'"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [appnet]
  db-jugadores:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jugadoresapp
      POSTGRES_PASSWORD: ${JUGADORES_DB_PASSWORD:?Define JUGADORES_DB_PASSWORD en .env}
      POSTGRES_DB: jugadoresdb
    volumes:
      - jugadores-data:/var/lib/postgresql/data
      - ./backend/jugadores/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [appnet]

  jugadores-service:
    build:
      context: .
      dockerfile: backend/jugadores/Dockerfile
    environment:
      CONSUL_HTTP_ADDR: http://consul:8500
      KAFKA_REST_URL: http://kafka-rest:8082
      SERVICE_NAME: jugadores
      DB_HOST: db-jugadores
      DB_PORT: "5432"
      DB_USER: jugadoresapp
      DB_PASSWORD: ${JUGADORES_DB_PASSWORD:?Define JUGADORES_DB_PASSWORD en .env}
      DB_NAME: jugadoresdb
      INSTANCE_NAME: jugadores-service
    depends_on:
      consul:
        condition: service_healthy
      db-jugadores:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/heartbeat"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [appnet]

  db-tienda:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tiendaapp
      POSTGRES_PASSWORD: ${TIENDA_DB_PASSWORD:?Define TIENDA_DB_PASSWORD en .env}
      POSTGRES_DB: tiendadb
    volumes:
      - tienda-data:/var/lib/postgresql/data
      - ./backend/tienda/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [appnet]

  tienda-service-1:
    build:
      context: .
      dockerfile: backend/tienda/Dockerfile
    environment:
      KAFKA_REST_URL: http://kafka-rest:8082
      CONSUL_HTTP_ADDR: http://consul:8500
      GRPC_GATEWAY_ADDR: gateway:9090
      SERVICE_NAME: tienda
      DB_HOST: db-tienda
      DB_PORT: "5432"
      DB_USER: tiendaapp
      DB_PASSWORD: ${TIENDA_DB_PASSWORD:?Define TIENDA_DB_PASSWORD en .env}
      DB_NAME: tiendadb
      INSTANCE_NAME: tienda-service-1
    depends_on:
      consul:
        condition: service_healthy
      db-tienda:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/heartbeat"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [appnet]

  tienda-service-2:
    build:
      context: .
      dockerfile: backend/tienda/Dockerfile
    environment:
      KAFKA_REST_URL: http://kafka-rest:8082
      CONSUL_HTTP_ADDR: http://consul:8500
      GRPC_GATEWAY_ADDR: gateway:9090
      SERVICE_NAME: tienda
      DB_HOST: db-tienda
      DB_PORT: "5432"
      DB_USER: tiendaapp
      DB_PASSWORD: ${TIENDA_DB_PASSWORD:?Define TIENDA_DB_PASSWORD en .env}
      DB_NAME: tiendadb
      INSTANCE_NAME: tienda-service-2
    depends_on:
      consul:
        condition: service_healthy
      db-tienda:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/heartbeat"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [appnet]

  db-cafeteria:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cafeteriaapp
      POSTGRES_PASSWORD: ${CAFETERIA_DB_PASSWORD:?Define CAFETERIA_DB_PASSWORD en .env}
      POSTGRES_DB: cafeteriadb
    volumes:
      - cafeteria-data:/var/lib/postgresql/data
      - ./backend/cafeteria/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [appnet]

  cafeteria-service:
    build:
      context: .
      dockerfile: backend/cafeteria/Dockerfile
    environment:
      KAFKA_REST_URL: http://kafka-rest:8082
      CONSUL_HTTP_ADDR: http://consul:8500
      GRPC_GATEWAY_ADDR: gateway:9090
      SERVICE_NAME: cafeteria
      DB_HOST: db-cafeteria
      DB_PORT: "5432"
      DB_USER: cafeteriaapp
      DB_PASSWORD: ${CAFETERIA_DB_PASSWORD:?Define CAFETERIA_DB_PASSWORD en .env}
      DB_NAME: cafeteriadb
      INSTANCE_NAME: cafeteria-service
    depends_on:
      consul:
        condition: service_healthy
      db-cafeteria:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/heartbeat"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [appnet]

  middleware:
    build:
      context: .
      dockerfile: middleware/Dockerfile
    environment:
      GRPC_GATEWAY_ADDR: gateway:9090
      KAFKA_REST_URL: http://kafka-rest:8082
    depends_on:
      kafka-rest:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/heartbeat"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [appnet]
  frontend:
    build: ./frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [appnet]
  gateway:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    environment:
      CONSUL_HTTP_ADDR: http://consul:8500
    ports: ["3000:80", "8000:8000"]
    depends_on:
      consul:
        condition: service_healthy
      jugadores-service:
        condition: service_healthy

      tienda-service-1:
        condition: service_healthy

      tienda-service-2:
        condition: service_healthy

      cafeteria-service:
        condition: service_healthy

      middleware:
        condition: service_healthy

      frontend:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/heartbeat"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [appnet]
  grpcurl:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: tools/grpcurl/Dockerfile
    volumes:
      - ./proto:/proto:ro
    networks: [appnet]
networks:
  appnet:
    driver: bridge
volumes:
  jugadores-data:
  tienda-data:
  cafeteria-data:
  consul-data:
  kafka-data:
